<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- Loading -->
  <div class="screen active" id="screen-loading">
    <div class="loading-screen">Loading…</div>
  </div>

  <!-- Auth screen -->
  <div class="screen" id="screen-auth">
    <h1>Time tracker</h1>
    <p class="sub" id="auth-subtitle">Sign in to track your time.</p>
    <div class="notice" id="auth-notice"></div>
    <div class="card">
      <button class="google-btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      <div class="divider">or</div>
      <div class="field">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')handleAuth()" />
      </div>
      <div class="field">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')handleAuth()" />
      </div>
      <div class="error" id="auth-error"></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="primary" id="auth-submit-btn" onclick="handleAuth()">Sign in</button>
      </div>
    </div>
    <div class="auth-footer">
      <span id="auth-footer-text">Don't have an account?</span>
      <button onclick="toggleAuthMode()" id="auth-toggle-btn">Sign up</button>
    </div>
  </div>

  <!-- Log screen -->
  <div class="screen" id="screen-log">
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="avatar" id="log-avatar"></div>
        <div>
          <div class="user-name" id="log-name"></div>
          <div class="user-email" id="log-email"></div>
        </div>
      </div>
      <button class="small danger" onclick="signOut()">Sign out</button>
    </div>

    <div class="stats-grid">
      <div class="stat"><div class="stat-label">Today</div><div class="stat-value" id="stat-today">0h</div></div>
      <div class="stat"><div class="stat-label">This week</div><div class="stat-value" id="stat-week">0h</div></div>
      <div class="stat"><div class="stat-label">This month</div><div class="stat-value" id="stat-month">0h</div></div>
    </div>

    <div class="card" style="margin-bottom:1.25rem">
      <button class="add-toggle" onclick="toggleAddForm()" id="add-toggle-btn">
        <span id="add-icon" style="font-size:18px;line-height:1;font-weight:300">+</span> Log a session
      </button>
      <div class="add-form" id="add-form">
        <div class="field">
          <label for="entry-date">Date</label>
          <input type="date" id="entry-date" />
        </div>
        <div class="row2">
          <div class="field">
            <label for="entry-start">Time in</label>
            <input type="time" id="entry-start" step="900" />
          </div>
          <div class="field">
            <label for="entry-end">Time out</label>
            <input type="time" id="entry-end" step="900" />
          </div>
        </div>
        <div class="field">
          <label for="entry-note">Note <span style="font-weight:400;color:#999">(optional)</span></label>
          <input type="text" id="entry-note" placeholder="e.g. client call, deep work…" />
        </div>
        <div class="error" id="entry-error"></div>
        <div class="btn-row" style="margin-top:12px">
          <button onclick="toggleAddForm()">Cancel</button>
          <button class="primary" id="save-btn" onclick="saveEntry()">Save</button>
        </div>
      </div>
    </div>

    <div class="filter-row">
      <select id="filter-month" onchange="renderLog()">
        <option value="">All months</option>
      </select>
    </div>

    <div class="section-title">Log</div>
    <div class="card" style="padding:0;overflow:hidden">
      <div id="log-table-wrap"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
