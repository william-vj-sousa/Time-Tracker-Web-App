<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f3; min-height: 100vh; padding: 0; color: #1a1a1a; }

  .app { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem; }
  .screen { display: none; }
  .screen.active { display: block; }

  h1 { font-size: 22px; font-weight: 500; margin-bottom: 0.25rem; }
  p.sub { font-size: 14px; color: #666; margin-bottom: 1.5rem; }

  .card { background: #fff; border: 0.5px solid #e0e0de; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }

  label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="time"] {
    width: 100%; padding: 9px 12px; border: 0.5px solid #e0e0de; border-radius: 8px;
    font-size: 15px; background: #fff; color: #1a1a1a; outline: none; font-family: inherit;
  }
  input:focus { border-color: #888; box-shadow: 0 0 0 2px rgba(100,100,200,0.1); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 12px; }

  button {
    cursor: pointer; font-family: inherit; font-size: 14px; border-radius: 8px;
    padding: 9px 18px; border: 0.5px solid #ccc; background: transparent;
    color: #1a1a1a; transition: background 0.12s;
  }
  button:hover { background: #f0f0ee; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  button.primary:hover { background: #333; }
  button.danger { color: #a32d2d; border-color: #f0c1c1; }
  button.danger:hover { background: #fdf0f0; }
  button.small { padding: 5px 10px; font-size: 12px; }

  .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  .google-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 10px 18px; border: 0.5px solid #e0e0de; border-radius: 8px;
    background: #fff; font-size: 15px; font-weight: 500; cursor: pointer;
    transition: background 0.12s; margin-bottom: 1rem;
  }
  .google-btn:hover { background: #f5f5f3; }

  .divider { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; color: #bbb; font-size: 13px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 0.5px; background: #e0e0de; }

  .auth-footer { text-align: center; font-size: 13px; color: #888; margin-top: 0.75rem; }
  .auth-footer button { font-size: 13px; border: none; background: none; padding: 0; color: #185fa5; text-decoration: underline; cursor: pointer; }
  .auth-footer button:hover { background: none; color: #0e3f70; }

  .notice { background: #e6f1fb; color: #185fa5; border-radius: 8px; padding: 12px 14px; font-size: 14px; margin-bottom: 1rem; display: none; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .top-bar-left { display: flex; align-items: center; gap: 10px; }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: #e6f1fb;
    display: flex; align-items: center; justify-content: center;
    font-weight: 500; font-size: 13px; color: #185fa5; flex-shrink: 0;
  }
  .user-name { font-size: 18px; font-weight: 500; }
  .user-email { font-size: 12px; color: #888; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  .stat { background: #efefed; border-radius: 8px; padding: 14px 16px; }
  .stat-label { font-size: 12px; color: #666; margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 500; }

  .section-title { font-size: 12px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: #888; font-weight: 500; padding: 6px 10px; border-bottom: 0.5px solid #e0e0de; }
  td { padding: 9px 10px; border-bottom: 0.5px solid #eee; }
  tr:last-child td { border-bottom: none; }
  tr.date-group td { background: #f5f5f3; font-weight: 500; font-size: 13px; color: #555; }
  .total-pill { font-size: 12px; font-weight: 500; background: #e6f1fb; color: #185fa5; padding: 2px 8px; border-radius: 20px; margin-left: 8px; }
  .empty { text-align: center; padding: 2.5rem 0; color: #888; font-size: 14px; }
  .del-btn { opacity: 0; background: none; border: none; padding: 4px 6px; color: #a32d2d; cursor: pointer; font-size: 13px; border-radius: 4px; }
  tr:hover .del-btn { opacity: 1; }

  .add-form { display: none; margin-top: 14px; border-top: 0.5px solid #eee; padding-top: 14px; }
  .add-form.open { display: block; }
  .add-toggle { width: 100%; text-align: left; display: flex; align-items: center; gap: 8px; font-size: 14px; border: none; background: none; padding: 0; cursor: pointer; }
  .add-toggle:hover { background: none; color: #555; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .filter-row select { padding: 7px 10px; border: 0.5px solid #e0e0de; border-radius: 8px; font-size: 13px; background: #fff; font-family: inherit; outline: none; color: #1a1a1a; cursor: pointer; }

  .error { color: #a32d2d; font-size: 13px; margin-top: 6px; display: none; }

  .loading-screen { text-align: center; padding: 4rem 0; color: #888; font-size: 14px; }

  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .row2 { grid-template-columns: 1fr; }
    .filter-row select { flex: 1; }
  }

  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #f0f0ee; }
    .card, .user-item, input[type="text"], input[type="email"], input[type="password"],
    input[type="date"], input[type="time"] { background: #242424; border-color: #333; color: #f0f0ee; }
    .google-btn { background: #242424; border-color: #333; color: #f0f0ee; }
    .google-btn:hover, button:hover { background: #2e2e2e; }
    .stat { background: #242424; }
    .stat-label, p.sub, .section-title, th { color: #888; }
    tr.date-group td { background: #1e1e1e; color: #aaa; }
    td { border-color: #2e2e2e; }
    button { border-color: #444; color: #f0f0ee; }
    button.primary { background: #f0f0ee; color: #1a1a1a; }
    button.primary:hover { background: #ddd; }
    .filter-row select { background: #242424; border-color: #333; color: #f0f0ee; }
    input:focus { border-color: #666; }
    .divider { color: #555; }
    .divider::before, .divider::after { background: #333; }
    .notice { background: #1a2a3a; color: #7ab3e0; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Loading -->
  <div class="screen active" id="screen-loading">
    <div class="loading-screen">Loading…</div>
  </div>

  <!-- Auth screen -->
  <div class="screen" id="screen-auth">
    <h1>Time tracker</h1>
    <p class="sub" id="auth-subtitle">Sign in to track your time.</p>
    <div class="notice" id="auth-notice"></div>
    <div class="card">
      <button class="google-btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      <div class="divider">or</div>
      <div class="field">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')handleAuth()" />
      </div>
      <div class="field">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')handleAuth()" />
      </div>
      <div class="error" id="auth-error"></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="primary" id="auth-submit-btn" onclick="handleAuth()">Sign in</button>
      </div>
    </div>
    <div class="auth-footer">
      <span id="auth-footer-text">Don't have an account?</span>
      <button onclick="toggleAuthMode()" id="auth-toggle-btn">Sign up</button>
    </div>
  </div>

  <!-- Log screen -->
  <div class="screen" id="screen-log">
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="avatar" id="log-avatar"></div>
        <div>
          <div class="user-name" id="log-name"></div>
          <div class="user-email" id="log-email"></div>
        </div>
      </div>
      <button class="small danger" onclick="signOut()">Sign out</button>
    </div>

    <div class="stats-grid">
      <div class="stat"><div class="stat-label">Today</div><div class="stat-value" id="stat-today">0h</div></div>
      <div class="stat"><div class="stat-label">This week</div><div class="stat-value" id="stat-week">0h</div></div>
      <div class="stat"><div class="stat-label">This month</div><div class="stat-value" id="stat-month">0h</div></div>
    </div>

    <div class="card" style="margin-bottom:1.25rem">
      <button class="add-toggle" onclick="toggleAddForm()" id="add-toggle-btn">
        <span id="add-icon" style="font-size:18px;line-height:1;font-weight:300">+</span> Log a session
      </button>
      <div class="add-form" id="add-form">
        <div class="field">
          <label for="entry-date">Date</label>
          <input type="date" id="entry-date" />
        </div>
        <div class="row2">
          <div class="field">
            <label for="entry-start">Time in</label>
            <input type="time" id="entry-start" />
          </div>
          <div class="field">
            <label for="entry-end">Time out</label>
            <input type="time" id="entry-end" />
          </div>
        </div>
        <div class="field">
          <label for="entry-note">Note <span style="font-weight:400;color:#999">(optional)</span></label>
          <input type="text" id="entry-note" placeholder="e.g. client call, deep work…" />
        </div>
        <div class="error" id="entry-error"></div>
        <div class="btn-row" style="margin-top:12px">
          <button onclick="toggleAddForm()">Cancel</button>
          <button class="primary" id="save-btn" onclick="saveEntry()">Save</button>
        </div>
      </div>
    </div>

    <div class="filter-row">
      <select id="filter-month" onchange="renderLog()">
        <option value="">All months</option>
      </select>
    </div>

    <div class="section-title">Log</div>
    <div class="card" style="padding:0;overflow:hidden">
      <div id="log-table-wrap"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ─── Config ───────────────────────────────────────────────────────────────
  // Replace these with your Supabase project values (see setup instructions)
  const SUPABASE_URL  = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON = 'YOUR_SUPABASE_ANON_KEY';
  // ──────────────────────────────────────────────────────────────────────────

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON);

  let currentUser = null;
  let entries     = [];
  let authMode    = 'signin';

  // ─── Auth state ───────────────────────────────────────────────────────────

  db.auth.onAuthStateChange(async (event, session) => {
    if (session?.user) {
      currentUser = session.user;
      entries = await loadEntries();
      showLog();
    } else {
      currentUser = null;
      entries = [];
      show('screen-auth');
    }
  });

  async function signInWithGoogle() {
    const { error } = await db.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin }
    });
    if (error) showAuthError(error.message);
  }

  async function handleAuth() {
    const email    = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    if (!email || !password) { showAuthError('Please enter your email and password.'); return; }

    const btn = document.getElementById('auth-submit-btn');
    btn.disabled = true;

    let error;
    if (authMode === 'signin') {
      ({ error } = await db.auth.signInWithPassword({ email, password }));
    } else {
      ({ error } = await db.auth.signUp({
        email, password,
        options: { emailRedirectTo: window.location.origin }
      }));
      if (!error) {
        showNotice('Check your email and click the confirmation link to activate your account.');
        btn.disabled = false;
        return;
      }
    }

    btn.disabled = false;
    if (error) showAuthError(error.message);
  }

  async function signOut() {
    await db.auth.signOut();
  }

  function toggleAuthMode() {
    authMode = authMode === 'signin' ? 'signup' : 'signin';
    const isSignin = authMode === 'signin';
    document.getElementById('auth-submit-btn').textContent  = isSignin ? 'Sign in' : 'Sign up';
    document.getElementById('auth-subtitle').textContent    = isSignin ? 'Sign in to track your time.' : 'Create your account.';
    document.getElementById('auth-footer-text').textContent = isSignin ? "Don't have an account?" : 'Already have an account?';
    document.getElementById('auth-toggle-btn').textContent  = isSignin ? 'Sign up' : 'Sign in';
    hideAuthError();
    document.getElementById('auth-notice').style.display = 'none';
  }

  // ─── Data ─────────────────────────────────────────────────────────────────

  async function loadEntries() {
    const { data, error } = await db
      .from('time_entries')
      .select('*')
      .order('date', { ascending: false })
      .order('start_time', { ascending: false });
    if (error) { console.error(error); return []; }
    return data || [];
  }

  async function saveEntry() {
    const date  = document.getElementById('entry-date').value;
    const start = document.getElementById('entry-start').value;
    const end   = document.getElementById('entry-end').value;
    const note  = document.getElementById('entry-note').value.trim();
    const errEl = document.getElementById('entry-error');

    if (!date || !start || !end) {
      errEl.textContent = 'Please fill in date, time in, and time out.';
      errEl.style.display = 'block'; return;
    }
    if (end <= start) {
      errEl.textContent = 'Time out must be after time in.';
      errEl.style.display = 'block'; return;
    }
    errEl.style.display = 'none';

    const btn = document.getElementById('save-btn');
    btn.disabled = true;

    const { data, error } = await db
      .from('time_entries')
      .insert({ user_id: currentUser.id, date, start_time: start, end_time: end, note: note || null })
      .select()
      .single();

    btn.disabled = false;

    if (error) { errEl.textContent = 'Failed to save. Please try again.'; errEl.style.display = 'block'; console.error(error); return; }

    entries.unshift(data);
    document.getElementById('entry-start').value = '';
    document.getElementById('entry-end').value   = '';
    document.getElementById('entry-note').value  = '';
    toggleAddForm();
    populateMonthFilter();
    renderStats();
    renderLog();
  }

  async function deleteEntry(id) {
    if (!confirm('Delete this entry?')) return;
    const { error } = await db.from('time_entries').delete().eq('id', id);
    if (error) { alert('Failed to delete. Please try again.'); console.error(error); return; }
    entries = entries.filter(e => e.id !== id);
    renderStats();
    populateMonthFilter();
    renderLog();
  }

  // ─── Display helpers ──────────────────────────────────────────────────────

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showLog() {
    show('screen-log');
    const name  = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
    const email = currentUser.email;
    document.getElementById('log-avatar').textContent = initials(name);
    document.getElementById('log-name').textContent   = name;
    document.getElementById('log-email').textContent  = email;
    document.getElementById('entry-date').value       = new Date().toISOString().slice(0, 10);
    populateMonthFilter();
    renderStats();
    renderLog();
  }

  function showAuthError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideAuthError() {
    document.getElementById('auth-error').style.display = 'none';
  }

  function showNotice(msg) {
    const el = document.getElementById('auth-notice');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function initials(name) {
    return name.trim().split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }

  function calcHours(start, end) {
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    return ((eh * 60 + em) - (sh * 60 + sm)) / 60;
  }

  function fmtHours(h) {
    if (h <= 0) return '0h';
    const hrs  = Math.floor(h);
    const mins = Math.round((h - hrs) * 60);
    if (mins === 0) return hrs + 'h';
    if (hrs === 0)  return mins + 'm';
    return hrs + 'h ' + mins + 'm';
  }

  function renderStats() {
    const now      = new Date();
    const today    = now.toISOString().slice(0, 10);
    const dow      = now.getDay();
    const diff     = dow === 0 ? -6 : 1 - dow;
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() + diff);
    const ws       = weekStart.toISOString().slice(0, 10);
    const monthPfx = today.slice(0, 7);
    let todayH = 0, weekH = 0, monthH = 0;
    entries.forEach(e => {
      const h = calcHours(e.start_time, e.end_time);
      if (e.date === today)                              todayH += h;
      if (e.date >= ws && e.date <= today)               weekH  += h;
      if (e.date.startsWith(monthPfx))                  monthH += h;
    });
    document.getElementById('stat-today').textContent = fmtHours(todayH);
    document.getElementById('stat-week').textContent  = fmtHours(weekH);
    document.getElementById('stat-month').textContent = fmtHours(monthH);
  }

  function populateMonthFilter() {
    const months = [...new Set(entries.map(e => e.date.slice(0, 7)))].sort().reverse();
    const sel    = document.getElementById('filter-month');
    const cur    = sel.value;
    sel.innerHTML = '<option value="">All months</option>' +
      months.map(m => {
        const [y, mo] = m.split('-');
        const label = new Date(+y, +mo - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
        return `<option value="${m}"${m === cur ? ' selected' : ''}>${label}</option>`;
      }).join('');
  }

  function renderLog() {
    const filterMonth = document.getElementById('filter-month').value;
    let filtered = entries.filter(e => !filterMonth || e.date.startsWith(filterMonth));
    filtered = [...filtered].sort((a, b) => b.date.localeCompare(a.date) || b.start_time.localeCompare(a.start_time));
    const wrap = document.getElementById('log-table-wrap');
    if (!filtered.length) {
      wrap.innerHTML = '<div class="empty">No entries yet — log your first session above.</div>';
      return;
    }
    const byDate = {};
    filtered.forEach(e => { if (!byDate[e.date]) byDate[e.date] = []; byDate[e.date].push(e); });
    let html = '<table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th><th>Note</th><th></th></tr></thead><tbody>';
    Object.keys(byDate).sort().reverse().forEach(date => {
      const rows     = byDate[date];
      const dayTotal = rows.reduce((s, e) => s + calcHours(e.start_time, e.end_time), 0);
      const d        = new Date(date + 'T12:00:00');
      const label    = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      html += `<tr class="date-group"><td colspan="3" style="padding:8px 10px">${label}</td><td colspan="3"><span class="total-pill">${fmtHours(dayTotal)} total</span></td></tr>`;
      rows.forEach(e => {
        const h = calcHours(e.start_time, e.end_time);
        html += `<tr>
          <td></td>
          <td>${e.start_time.slice(0, 5)}</td>
          <td>${e.end_time.slice(0, 5)}</td>
          <td style="font-weight:500">${fmtHours(h)}</td>
          <td style="color:#888;font-size:13px">${e.note || ''}</td>
          <td><button class="del-btn" onclick="deleteEntry('${e.id}')">✕</button></td>
        </tr>`;
      });
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  function toggleAddForm() {
    const f = document.getElementById('add-form');
    f.classList.toggle('open');
    document.getElementById('add-icon').textContent = f.classList.contains('open') ? '−' : '+';
    document.getElementById('entry-error').style.display = 'none';
  }
</script>
</body>
</html>
